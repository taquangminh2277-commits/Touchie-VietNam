name: Touchie Vietnam CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. CONTINUOUS INTEGRATION: Quality, Assets, Links & Smoke Tests
  # =========================================================================
  quality-check:
    name: 🧪 Automated Verification & Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 🔍 Run Automated Verification Suite
        run: |
          node scripts/verify-site.mjs

      - name: 📊 Generate CI Summary Report
        if: always()
        run: |
          echo "## 🕯️ Touchie Vietnam - CI Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** \`${{ github.actor }}\` via \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Verified Checks:" >> $GITHUB_STEP_SUMMARY
          echo "- [x] HTML5 Core Structure, Meta tags & UTF-8 Encoding" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Static Assets Integrity (Logos, Product Images)" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Navigation Anchor Links (#collections, #giftsets, #care-guide, ...)" >> $GITHUB_STEP_SUMMARY
          echo "- [x] E-Commerce Interactive Elements (Drawer, Modals, VietQR, Mood Matcher)" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Pricing Logic (149k single jars, 399k giftset & freeship)" >> $GITHUB_STEP_SUMMARY
          echo "- [x] HTTP Integration Server Smoke Test (HTTP 200 OK)" >> $GITHUB_STEP_SUMMARY

  # =========================================================================
  # 2. CONTINUOUS DEPLOYMENT: Cloudflare Workers Deployment & Health Check
  # =========================================================================
  deploy-cloudflare:
    name: 🚀 Cloudflare Deployment & Health Check
    needs: quality-check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 🚀 Deploy via Wrangler (if Secret configured)
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: ℹ️ Cloudflare Git Integration Notice
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "Cloudflare API Token not specified in GitHub Secrets."
          echo "Deployment is automatically handled by Cloudflare's native Git Integration on push to 'main'."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: 🩺 Production Endpoint Health Check
        run: |
          echo "Waiting 5 seconds for edge propagation..."
          sleep 5
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://touchie-vietnam.taquangminh2277.workers.dev || echo "000")
          echo "Production URL: https://touchie-vietnam.taquangminh2277.workers.dev"
          echo "HTTP Status Code: $STATUS_CODE"
          if [ "$STATUS_CODE" -eq 200 ]; then
            echo "✔ Production site is LIVE and healthy (200 OK)!"
          else
            echo "⚠️ Warning: Received HTTP $STATUS_CODE from production endpoint."
          fi

      - name: 🌐 Generate CD Deployment Report
        if: always()
        run: |
          echo "## 🚀 Deployment Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Production URL:** [https://touchie-vietnam.taquangminh2277.workers.dev](https://touchie-vietnam.taquangminh2277.workers.dev)" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ✅ Successfully Verified and Deployed" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform:** Cloudflare Workers (Static Assets)" >> $GITHUB_STEP_SUMMARY
